trigger:
- main

pool:
  name: 'Default'
  demands:
  - agent.name -equals macs-MacBook-Pro

variables:
  buildConfiguration: 'Release'

steps:
# 1. Fast Checkout
- checkout: self
  fetchDepth: 1

# 2. .NET SDK Setup
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# 3. Restore & Build (Finding the project file automatically)
- task: DotNetCoreCLI@2
  displayName: 'Restore and Build'
  inputs:
    command: 'build'
    # Yeh '**/*.csproj' poore folders me project file dhoond lega
    projects: '**/*.csproj' 
    arguments: '--configuration $(buildConfiguration)'

# 4. Publish (Creating the ZIP for manual release)
- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

# 5. Save Artifact
- task: PublishBuildArtifacts@1
  displayName: 'Save Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'MovieShop-Manual-Release'
    publishLocation: 'Container'