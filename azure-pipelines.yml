trigger:
  branches:
    include:
    - main

variables:
- name: buildConfiguration
  value: 'Release'

stages:
- stage: Build
  jobs:
  - job: BuildJob
    pool:
      name: 'Default'
      demands:
      - Agent.Name -equals macs-MacBook-Pro
    steps:
    # This will find and build any .csproj file in the directory tree
    - task: DotNetCoreCLI@2
      displayName: 'Dotnet Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    # Optional: Keep this if you want to verify the output locally on your Mac
    - task: DotNetCoreCLI@2
      displayName: 'Dotnet Publish'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: false