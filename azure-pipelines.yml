trigger:
- main

pool:
  name: 'Default'
  demands:
  - agent.name -equals macs-MacBook-Pro

variables:
  buildConfiguration: 'Release'

steps:
# 1. SDK Setup (Ensure your Mac has the right .NET version)
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x' # Ya jo version aap use kar rahe hain

# 2. Restore & Build
- script: |
    dotnet restore
    dotnet build --configuration $(buildConfiguration)
  displayName: 'Dotnet Restore and Build'

# 3. Publish (Creating the ZIP for manual upload)
- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

# 4. Artifact Store (Isse aap file download kar payenge)
- task: PublishBuildArtifacts@1
  displayName: 'Save Artifact for Manual Release'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'MovieShop-Build'
    publishLocation: 'Container'