trigger:
- main

pool:
  name: 'Default'
  demands:
  - agent.name -equals macs-MacBook-Pro

variables:
  buildConfiguration: 'Release'

steps:
# 1. Fast Checkout (latest code only)
- checkout: self
  fetchDepth: 1

# 2. .NET 10 SDK Setup (including preview versions)
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'
    includePreviewVersions: true

# 3. Restore & Build (Finding projects automatically)
- task: DotNetCoreCLI@2
  displayName: 'Restore and Build'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration)'

# 4. Publish (Creating the ZIP file for you to download)
- task: DotNetCoreCLI@2
  displayName: 'Publish to Artifact'
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
    zipAfterPublish: true

# 5. Save Artifact (Isi file ko aap download karke manual release karenge)
- task: PublishBuildArtifacts@1
  displayName: 'Save Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'MovieShop-Manual-Release'
    publishLocation: 'Container'